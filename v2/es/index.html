<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

     This page lives at /v2/kinetic/ while it is being built. If the branch were
     ever published with this removed, Google would index a second copy of the
     homepage at a staging path - duplicate content competing with the real
     site. The canonical below already points at the destination URL, so the
     moment this becomes the site, delete this one line and nothing else. -->
<meta name="robots" content="noindex">

<!-- Canonical and hreflang describe where this page will LIVE, not where the
     file currently sits. That is deliberate: it is the same page, at a
     temporary path. -->
<link rel="canonical" href="https://khipuai.co/es/">
<link rel="alternate" hreflang="en" href="https://khipuai.co/">
<link rel="alternate" hreflang="es" href="https://khipuai.co/es/">

<meta property="og:type" content="website">

<meta property="og:description" content="Encuentra el trabajo manual que más le cuesta a tu equipo y recibe un primer paso defendible con una estimación.">
<meta property="og:url" content="https://khipuai.co/es/">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "KHIPUAI",
  "url": "https://khipuai.co",
  "logo": "https://khipuai.co/og-image.png",
  "image": "https://khipuai.co/og-image.png",
  "description": "Estudio de automatización con IA para empresas de servicios recurrentes. La auditoría mapea el trabajo manual, cuantifica los cuellos de botella y entrega una hoja de ruta priorizada.",
  "founder": {"@type": "Person", "name": "Wil Mora", "url": "https://khipuai.co/about/"},
  "email": "wil@khipuai.co",
  "areaServed": [{"@type": "Country", "name": "United States"}, {"@type": "Country", "name": "Canada"}],
  "knowsAbout": ["back office automation", "AI workflow automation", "automation audit", "business process automation"],
  "makesOffer": {
    "@type": "AggregateOffer",
    "priceCurrency": "USD",
    "lowPrice": "2250",
    "highPrice": "7300",
    "offerCount": 1,
    "itemOffered": {"@type": "Service", "name": "The AI Automation Audit", "url": "https://khipuai.co/audit/"}
  }
}
</script>

<link rel="stylesheet" href="../shared/assets/fonts.css">
<link rel="stylesheet" href="../shared/kinetic.css">
<link rel="icon" href="../shared/assets/mark.svg">
</head>
<body>

<a class="skip" href="#p-start">Ir al contenido</a>

<header class="hd">
  <a class="bd" href="../es/"><img src="../shared/assets/mark.svg" alt="">KHIPUAI</a>
  <nav id="nav" aria-label="Secciones"></nav>
  <div class="lang">
    <a href="../kinetic/" hreflang="en" lang="en" aria-label="View this page in English">EN</a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="on" lang="es" aria-current="true">ES</span>
  </div>
  <a class="hd-cta" id="header-book" href="#">Agenda una llamada <span aria-hidden="true">&rarr;</span></a>
</header>

<div class="cordwrap"><svg class="cord" id="cord" aria-hidden="true" preserveAspectRatio="none"></svg></div>

<main class="track" id="track"></main>

<div class="rail"><i id="railfill"></i></div>

<div class="foot">
  <div class="hint" id="hint"><span>Desliza</span><span class="ar">&rarr;</span></div>
</div>

<script type="module">
import { buildKinetic, esc, checkContentParity, heroProofIcon, mountQuote, setQuoteBooking } from '../shared/kinetic.js';
import { C } from '../shared/content.es.js';
import { getQuestions, askQuote, fmt } from '../shared/quote.js';

document.getElementById('header-book').href = C.booking;

// Warns in the console (localhost only) if the Spanish file has drifted from
// the English one. The live site's Spanish mirror drifts silently; this is the
// cheapest way to stop that happening again.
checkContentParity(C, 'content.es.js');

// `at` sets where the content sits vertically. Varying it is most of what
// stops a horizontal site reading as a deck.
const P = [
  { id:'start', n:'Resumen', navOrder:1, at:'at-mid', html:`
    <div class="knot" id="knot">
      <img src="../shared/assets/khipu-mountain-hero-v5.webp" width="1672" height="941" alt="">
      <canvas class="khipu-network" data-khipu-network aria-hidden="true"></canvas>
      <div class="hero-node-labels" aria-label="Áreas operativas conectadas">
        ${C.heroLabels.map((label,i)=>`<span class="node-${i+1}">${esc(label)}</span>`).join('')}
      </div>
    </div>
    <div class="inner">
      <div class="kick" data-rv>${esc(C.hero.eyebrow)}</div>
      <h1 data-rv>${esc(C.hero.headline)}<em>${esc(C.hero.headlineEm)}</em></h1>
      <p class="lede" data-rv>${esc(C.hero.sub)}</p>
      <div class="row" data-rv>
        <a class="btn" href="${C.booking}">${esc(C.hero.cta)}</a>
        <button class="btn line" data-to="fee">Encuentra tu punto de partida</button>
      </div>
    </div>
    <p class="hero-aside" data-rv>${C.heroAside.map(line=>`<span>${esc(line)}</span>`).join('')}</p>
    <div class="hero-proof" data-rv aria-label="Por qué KHIPUAI">
      ${C.heroProof.map(([title,detail],i)=>`<div>${heroProofIcon(i)}<p><strong>${esc(title)}</strong><span>${esc(detail)}</span></p></div>`).join('')}
    </div>` },

  { id:'problem', n:'Problema', navOrder:2, at:'at-low', html:`
    <h2 class="say" data-rv style="max-width:17ch;">Decenas de horas al mes. <em>Nadie las ha contado.</em></h2>
    <ul class="runlist" data-rv>${C.problem.items.map((t,i)=>`<li><i>0${i+1}</i><span>${esc(t)}</span></li>`).join('')}</ul>
    <p class="sub" data-rv>${esc(C.problem.close)}</p>` },

  { id:'get', n:'Resultados', navOrder:4, at:'at-top', html:`
    <div class="kick" data-rv>Qué recibes</div>
    <h2 class="say" data-rv style="max-width:20ch;">Un plan corto y concreto <em>sobre el que puedes actuar.</em></h2>
    <div class="cols c6" data-rv>${C.deliverables.map(([t,d])=>`<div><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
    <div class="nolines" data-rv>${C.noLines.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <span class="swipe-note">Desliza la fila &rarr;</span>` },

  { id:'process', n:'Enfoque', navOrder:3, at:'at-mid', html:`
    <h2 class="say" data-rv style="max-width:16ch;">Tres pasos. <em>Alrededor de dos semanas.</em></h2>
    <div class="cols c3" data-rv>${C.steps.map(([t,d],i)=>`<div><b>0${i+1}</b><h3 style="margin-top:12px;">${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
    <span class="swipe-note">Desliza la fila &rarr;</span>
    <p class="fine" data-rv>${esc(C.legal)}</p>` },

  { id:'work', n:'Proyectos', navOrder:5, at:'at-low', html:`
    <div class="kick" data-rv>Formas en que ayudamos</div>
    <h2 class="say" data-rv style="max-width:22ch;">Construido alrededor del trabajo <em>que tu equipo ya hace.</em></h2>
    <div class="cols c6" data-rv>${C.work.map(w=>`<div><b>${esc(w.big)}</b><span class="cap">${esc(w.lab)}</span>
      <h3 style="margin-top:12px;">${esc(w.t)}</h3><p>${esc(w.d)}</p></div>`).join('')}</div>
    <span class="swipe-note">Desliza la fila &rarr;</span>
    <p class="fine" data-rv>${esc(C.disclaimer)}</p>` },

  { id:'fee', n:'Presupuesto', nav:false, at:'at-top', html:`
    <div class="kick" data-rv>Encaje y estimación del proyecto</div>
    <h2 class="say" data-rv style="max-width:20ch;">Encuentra tu <em>mejor punto de partida.</em></h2>
    <div class="quote-wrap" id="quote" data-rv></div>` },

{ id:'fit', n:'Encaje', nav:false, at:'at-mid', html:`
    <div class="kick" data-rv>Para quién es</div>
    <h2 class="say" data-rv style="max-width:22ch;">Vale la pena hacerlo, <em>o vale la pena decir que no.</em></h2>
    <div class="fit" data-rv>
      <div class="yes">
        <h3>${esc(C.fit.forTitle)}</h3>
        <ul>${C.fit.forYou.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
      <div class="no">
        <h3>${esc(C.fit.notTitle)}</h3>
        <ul>${C.fit.notForYou.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
    </div>` },

  { id:'questions', n:'Preguntas', nav:false, at:'at-mid', html:`
    <h2 class="say" data-rv style="max-width:18ch;">Lo que <em>la gente realmente pregunta.</em></h2>
    <div class="qa" data-rv>${C.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>` },

  { id:'operator', n:'Nosotros', navOrder:6, at:'at-low', html:`
    <div class="kick" data-rv>Quién lo dirige</div>
    <h2 class="say quote" data-rv>
      <em>&ldquo;${esc(C.founder.quote)}&rdquo;</em></h2>
    <div class="team" data-rv>
      <div class="member">
        <img src="../shared/assets/founder.jpg" alt="${esc(C.founder.name)}, fundador de KHIPUAI">
        <div>
          <h3>${esc(C.founder.name)}</h3>
          <span class="cap">Fundador</span>
          <p>${esc(C.founder.bio)}</p>
        </div>
      </div>
      <div class="member">
        <img src="../shared/assets/alex.jpg" alt="Alex Pena, desarrollador en KHIPUAI">
        <div>
          <h3>Alex Pena</h3>
          <span class="cap">Desarrollador</span>
          <p>Construye y prueba los sistemas detrás del trabajo: el sitio web y las herramientas internas con las que se entrega la automatización.</p>
        </div>
      </div>
    </div>
    <div class="row" data-rv style="margin-top:26px;">
      <a class="btn" href="${C.booking}">${esc(C.hero.cta)}</a>
      <a class="btn line" href="../about/">Cómo trabaja KHIPUAI</a>
      <a class="btn line" href="../self-assessment/">Haz la autoevaluación</a>
    </div>` },
];

const QT = {
  step: 'Pregunta', back: 'Atrás', working: 'Calculando…',
  recommended: 'Primer paso recomendado', relevant: 'Patrón de proyecto relevante',
  estimate: 'Es una estimación, no un presupuesto en firme. Una persona lo confirma en la llamada.',
  placeholder: 'Los precios fuera de Estados Unidos y Canadá aún no son definitivos.',
  book: 'Agenda una llamada gratuita de 30 minutos', restart: 'Empezar de nuevo',
};

buildKinetic(P, C);
setQuoteBooking(C.booking);
mountQuote(document.getElementById('quote'), {
  QUESTIONS: getQuestions('es'),
  askQuote: a => askQuote(a, { lang: 'es' }),
  fmt, t: QT });
</script>
</body>
</html>
