<script type="module">
import { buildKinetic } from '../shared/kinetic.js';

/* Wil's four bio paragraphs are split across four sections rather than stacked
   into one. At roughly 125 words a screen they do not fit together, and the
   split is not arbitrary: each paragraph is already a distinct chapter -
   who he is, the operating decade, the move to transformation, KHIPUAI now. */
const P = [
  { id:'intro', n:'About', at:'at-mid', html:`
    <div class="inner">
      <div class="kick" data-rv>About</div>
      <h1 data-rv style="font-size:min(7vw,9.5vh,7rem);">An operator,<em>not an agency.</em></h1>
      <p class="lede" data-rv>Most automation advice comes from people who have never run the operation they are automating. This is who is behind KHIPUAI, how the work is done, and what &ldquo;finance-grade&rdquo; actually means.</p>
    </div>` },

  { id:'wil', n:'Wil', at:'at-low', html:`
    <div class="face" data-rv>
      <img src="../shared/assets/founder.jpg" alt="Wil Mora, Founder of KHIPUAI">
      <div>
        <div class="kick">Founder</div>
        <h2 class="say" style="font-size:min(3.4vw,5vh,2.7rem);max-width:20ch;">Wil Mora</h2>
        <p class="sub">I have spent 15 years on the operating side of real businesses in Peru, the US, and Canada, with a finance degree (B.Comm, Toronto Metropolitan University) underneath it. Bilingual, English and Spanish.</p>
      </div>
    </div>` },

  { id:'operating', n:'Operating', at:'at-mid', html:`
    <div class="kick" data-rv>The first decade</div>
    <h2 class="say" data-rv style="max-width:18ch;">I paid the cost of manual work <em>every day.</em></h2>
    <p class="sub" data-rv>Running operations directly: supervising high-volume production plants, then leading logistics and customer service across 20 plants and 280-plus trucks moving over a million cubic meters of product a year, with a team of more than 20 people.</p>
    <p class="sub" data-rv>That work taught me what manual processes cost, because I paid that cost every day in overtime, errors, and missed handoffs.</p>` },

  { id:'transform', n:'Transformation', at:'at-top', html:`
    <div class="kick" data-rv>Then the other side of it</div>
    <h2 class="say" data-rv style="max-width:19ch;">The same problem, <em>from the inside.</em></h2>
    <p class="sub" data-rv>At a North American building-materials enterprise I led the projects that introduced AI tooling into core workflows.</p>
    <div class="cols c3" data-rv>
      <div><b>01</b><span class="cap">AI-assisted review</span><p>Introduced structured AI review into a technical workflow where accuracy and traceability mattered.</p></div>
      <div><b>02</b><span class="cap">Executive analytics</span><p>Built decision tools on the company's own SQL, Qlik, and AWS data stack.</p></div>
      <div><b>03</b><span class="cap">Process redesign</span><p>Rebuilt operational and commercial work around clear steps, ownership, and measurable decisions.</p></div>
    </div>
    <p class="fine" data-rv>Founder experience from a prior operating role, not a KHIPUAI client case study.</p>` },

  { id:'today', n:'Today', at:'at-low', html:`
    <div class="kick" data-rv>Today</div>
    <h2 class="say" data-rv style="max-width:20ch;">Built for operating teams, <em>not demos.</em></h2>
    <p class="sub" data-rv>KHIPUAI builds working systems that connect documents, business rules, dashboards, and approvals inside the tools a team already relies on.</p>
    <p class="fine" data-rv>Specific client stories and measured outcomes will be published after evidence and permission are reviewed.</p>` },

  { id:'team', n:'Team', at:'at-low', html:`
    <div class="face" data-rv>
      <img src="../shared/assets/alex.jpg" alt="Alex Pena, Developer at KHIPUAI">
      <div>
        <div class="kick">Developer</div>
        <h2 class="say" style="font-size:min(3.4vw,5vh,2.7rem);max-width:20ch;">Alex Pena</h2>
        <p class="sub">Alex builds and tests the systems behind the work: KHIPUAI's website and the internal tools the automation is delivered through. He works across the build, from the interface a client sees to the checks that run before anything ships.</p>
      </div>
    </div>` },

  { id:'method', n:'Method', at:'at-top', html:`
    <div class="kick" data-rv>Methodology</div>
    <h2 class="say" data-rv style="max-width:18ch;">How the work <em>is done.</em></h2>
    <div class="cols c6" data-rv>
      <div><b>01</b><h3 style="margin-top:12px;">Map the real workflow</h3><p>Not the org chart version. The actual steps, systems, handoffs, and workarounds your team uses, observed in working sessions.</p></div>
      <div><b>02</b><h3 style="margin-top:12px;">Measure it</h3><p>Hours per month and dollars per year on every manual step, using your team's real volumes and conservative assumptions, so the numbers survive scrutiny.</p></div>
      <div><b>03</b><h3 style="margin-top:12px;">Rank by value against effort</h3><p>Quick wins first, big builds only when the math earns them. The output is a sequence, not a wish list.</p></div>
      <div><b>04</b><h3 style="margin-top:12px;">Build with a human in the loop</h3><p>Anything that matters is draft-not-auto-post: the system prepares the work, a person reviews and approves. Nothing runs on its own.</p></div>
    </div>
    <span class="swipe-note">Swipe the row &rarr;</span>` },

  { id:'standard', n:'Standard', at:'at-mid', html:`
    <div class="kick" data-rv>The standard</div>
    <h2 class="say" data-rv style="max-width:20ch;">What <em>&ldquo;finance-grade&rdquo;</em> means here.</h2>
    <div class="cols c6" data-rv>
      <div><h3>Accuracy-checked</h3><p>Machine output is graded for confidence (GREEN / YELLOW / RED) so reviewers know exactly where to look, instead of trusting a black box.</p></div>
      <div><h3>Human-approved</h3><p>Automations create draft records in your own systems. A person approves every post that matters. That is a design principle, not a limitation.</p></div>
      <div><h3>Auditable</h3><p>Every record traces back to its source document, so your accountant, auditor, or client can follow the trail.</p></div>
      <div><h3>Survives your IT review</h3><p>Built to run inside enterprise security controls: application allowlisting, Microsoft Entra identity, Azure Key Vault, least-privilege access. Your IT team gets a security one-pager.</p></div>
    </div>
    <p class="fine" data-rv>It is a working standard, not a certification.</p>` },
];

buildKinetic(P);
