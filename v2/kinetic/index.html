<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Title and description carried over from the live landing page rather than
     rewritten: same business, same offer, and the current wording is what the
     site already ranks on. Changing the copy is a separate decision from
     changing the design. -->
<title>KHIPUAI | The AI Automation Audit</title>
<meta name="description" content="Find the manual work costing your team the most. KHIPUAI maps complex back-office workflows, quantifies the bottlenecks, and gives you a defensible first move.">

<!-- STAYS UNTIL THE SWITCH.
     This page lives at /v2/kinetic/ while it is being built. If the branch were
     ever published with this removed, Google would index a second copy of the
     homepage at a staging path - duplicate content competing with the real
     site. The canonical below already points at the destination URL, so the
     moment this becomes the site, delete this one line and nothing else. -->
<meta name="robots" content="noindex">

<!-- Canonical and hreflang describe where this page will LIVE, not where the
     file currently sits. That is deliberate: it is the same page, at a
     temporary path. -->
<link rel="canonical" href="https://khipuai.co/">
<link rel="alternate" hreflang="en" href="https://khipuai.co/">
<link rel="alternate" hreflang="es" href="https://khipuai.co/es/">
<link rel="alternate" hreflang="x-default" href="https://khipuai.co/">

<meta property="og:type" content="website">
<meta property="og:title" content="KHIPUAI | The AI Automation Audit">
<meta property="og:description" content="Find the manual work costing your team the most, then get a costed and defensible first move.">
<meta property="og:url" content="https://khipuai.co">
<meta property="og:image" content="https://khipuai.co/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="KHIPUAI | The AI Automation Audit">
<meta name="twitter:description" content="Find the manual work costing your team the most and get a defensible first move.">
<meta name="twitter:image" content="https://khipuai.co/og-image.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "KHIPUAI",
  "url": "https://khipuai.co",
  "logo": "https://khipuai.co/og-image.png",
  "image": "https://khipuai.co/og-image.png",
  "description": "AI automation studio for recurring-service businesses. The AI Automation Audit maps manual work, quantifies operational bottlenecks, and delivers a prioritized automation roadmap.",
  "founder": {"@type": "Person", "name": "Wil Mora", "url": "https://khipuai.co/about/"},
  "email": "wil@khipuai.co",
  "areaServed": [{"@type": "Country", "name": "United States"}, {"@type": "Country", "name": "Canada"}],
  "knowsAbout": ["back office automation", "AI workflow automation", "automation audit", "business process automation"],
  "makesOffer": {
    "@type": "AggregateOffer",
    "priceCurrency": "USD",
    "lowPrice": "2250",
    "highPrice": "7300",
    "offerCount": 1,
    "itemOffered": {"@type": "Service", "name": "The AI Automation Audit", "url": "https://khipuai.co/audit/"}
  }
}
</script>

<link rel="stylesheet" href="../shared/assets/fonts.css">
<link rel="stylesheet" href="../shared/kinetic.css">
<link rel="icon" href="../shared/assets/mark.svg">
</head>
<body>

<a class="skip" href="#p-start">Skip to content</a>

<header class="hd">
  <a class="bd" href="../kinetic/"><img src="../shared/assets/mark.svg" alt="">KHIPUAI</a>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="lang">
    <span class="on" lang="en" aria-current="true">EN</span>
    <span class="sep" aria-hidden="true">/</span>
    <a href="../es/" hreflang="es" lang="es" aria-label="Ver esta página en español">ES</a>
  </div>
</header>

<div class="cordwrap"><svg class="cord" id="cord" aria-hidden="true" preserveAspectRatio="none"></svg></div>

<main class="track" id="track"></main>

<div class="rail"><i id="railfill"></i></div>

<div class="foot">
  <div class="hint" id="hint"><span>Scroll</span><span class="ar">&rarr;</span></div>
</div>

<script type="module">
import { buildKinetic, esc, mountQuote, setQuoteBooking } from '../shared/kinetic.js';
import { C } from '../shared/content.js';
import { getQuestions, askQuote, fmt } from '../shared/quote.js';

// `at` sets where the content sits vertically. Varying it is most of what
// stops a horizontal site reading as a deck.
const P = [
  { id:'start', n:'Overview', at:'at-mid', html:`
    <div class="knot" id="knot">
      <img src="../shared/assets/khipu-neural-v3.webp" width="1536" height="1024" alt="An organized Andean khipu with multiple knotted cords representing structured information">
      <canvas class="khipu-network" data-khipu-network aria-hidden="true"></canvas>
    </div>
    <div class="inner">
      <div class="kick" data-rv>${esc(C.hero.eyebrow)}</div>
      <h1 data-rv>${esc(C.hero.headline)}<em>${esc(C.hero.headlineEm)}</em></h1>
      <p class="lede" data-rv>${esc(C.hero.sub)}</p>
      <div class="row" data-rv>
        <a class="btn" href="${C.booking}">${esc(C.hero.cta)}</a>
        <button class="btn line" data-to="fee">Find your starting point</button>
      </div>
    </div>` },

  { id:'problem', n:'Problem', at:'at-low', html:`
    <h2 class="say" data-rv style="max-width:17ch;">Dozens of hours a month. <em>Nobody has counted them.</em></h2>
    <ul class="runlist" data-rv>${C.problem.items.map((t,i)=>`<li><i>0${i+1}</i><span>${esc(t)}</span></li>`).join('')}</ul>
    <p class="sub" data-rv>${esc(C.problem.close)}</p>` },

  { id:'get', n:'Deliverables', at:'at-top', html:`
    <div class="kick" data-rv>The deliverable</div>
    <h2 class="say" data-rv style="max-width:20ch;">A short, concrete plan <em>you can act on.</em></h2>
    <div class="cols c6" data-rv>${C.deliverables.map(([t,d])=>`<div><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
    <div class="nolines" data-rv>${C.noLines.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <span class="swipe-note">Swipe the row &rarr;</span>` },

  { id:'process', n:'Process', at:'at-mid', html:`
    <h2 class="say" data-rv style="max-width:16ch;">Three steps. <em>About two weeks.</em></h2>
    <div class="cols c3" data-rv>${C.steps.map(([t,d],i)=>`<div><b>0${i+1}</b><h3 style="margin-top:12px;">${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
    <span class="swipe-note">Swipe the row &rarr;</span>
    <p class="fine" data-rv>${esc(C.legal)}</p>` },

  { id:'work', n:'Work', at:'at-low', html:`
    <div class="kick" data-rv>Ways we help</div>
    <h2 class="say" data-rv style="max-width:22ch;">Built around the work <em>your team already does.</em></h2>
    <div class="cols c6" data-rv>${C.work.map(w=>`<div><b>${esc(w.big)}</b><span class="cap">${esc(w.lab)}</span>
      <h3 style="margin-top:12px;">${esc(w.t)}</h3><p>${esc(w.d)}</p></div>`).join('')}</div>
    <span class="swipe-note">Swipe the row &rarr;</span>
    <p class="fine" data-rv>${esc(C.disclaimer)}</p>` },

  { id:'fee', n:'Quote', at:'at-top', html:`
    <div class="kick" data-rv>Project fit and estimate</div>
    <h2 class="say" data-rv style="max-width:18ch;">Find your <em>best starting point.</em></h2>
    <div class="quote-wrap" id="quote" data-rv></div>` },

{ id:'fit', n:'Fit', at:'at-mid', html:`
    <div class="kick" data-rv>Who it is for</div>
    <h2 class="say" data-rv style="max-width:20ch;">Worth doing, <em>or worth saying no to.</em></h2>
    <div class="fit" data-rv>
      <div class="yes">
        <h3>${esc(C.fit.forTitle)}</h3>
        <ul>${C.fit.forYou.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
      <div class="no">
        <h3>${esc(C.fit.notTitle)}</h3>
        <ul>${C.fit.notForYou.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
    </div>` },

  { id:'questions', n:'Questions', at:'at-mid', html:`
    <h2 class="say" data-rv style="max-width:18ch;">The things <em>people actually ask.</em></h2>
    <div class="qa" data-rv>${C.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>` },

  { id:'operator', n:'Team', at:'at-low', html:`
    <div class="kick" data-rv>Who runs it</div>
    <h2 class="say quote" data-rv>
      <em>&ldquo;${esc(C.founder.quote)}&rdquo;</em></h2>
    <div class="team" data-rv>
      <div class="member">
        <img src="../shared/assets/founder.jpg" alt="${esc(C.founder.name)}, Founder of KHIPUAI">
        <div>
          <h3>${esc(C.founder.name)}</h3>
          <span class="cap">Founder</span>
          <p>${esc(C.founder.bio)}</p>
        </div>
      </div>
      <div class="member">
        <img src="../shared/assets/alex.jpg" alt="Alex Pena, Developer at KHIPUAI">
        <div>
          <h3>Alex Pena</h3>
          <span class="cap">Developer</span>
          <p>Builds and tests the systems behind the work: the website and the internal tools the automation is delivered through.</p>
        </div>
      </div>
    </div>
    <div class="row" data-rv style="margin-top:26px;">
      <a class="btn" href="${C.booking}">${esc(C.hero.cta)}</a>
      <a class="btn line" href="../about/">How KHIPUAI works</a>
      <a class="btn line" href="../self-assessment/">Take the self-assessment</a>
    </div>` },
];

const QT = {
  step: 'Question', back: 'Back', working: 'Working it out…',
  recommended: 'Recommended first step', relevant: 'Relevant build pattern',
  estimate: 'This is an estimate, not a binding quote. A person confirms it on the call.',
  placeholder: 'Pricing outside the United States and Canada is not final yet.',
  book: 'Book a free 30-minute call', restart: 'Start again',
};

buildKinetic(P, C);
setQuoteBooking(C.booking);
mountQuote(document.getElementById('quote'), {
  QUESTIONS: getQuestions('en'),
  askQuote: a => askQuote(a, { lang: 'en' }),
  fmt, t: QT });
</script>
</body>
</html>
