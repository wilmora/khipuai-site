<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KHIPUAI — Kinetic concept</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../shared/assets/fonts.css">
<link rel="icon" href="../shared/assets/mark.svg">
<style>
/* =========================================================================
   CONCEPT: "Kinetic"  -  a site that moves sideways.

   Third pass. The note was that it read like a PowerPoint deck, which it did,
   and for structural reasons rather than cosmetic ones: eight sealed boxes of
   identical size, hard-snapped so you could never rest between them, each
   opening with the same kicker-then-headline beat.

   What changed, in order of how much it matters:

   1. ONE SCREEN PER SECTION, EXACTLY. Every section is 100vw and all of its
      content fits in one screen - nothing is scrolled through twice, and at
      rest you never see part of the next section alongside the one you are
      reading. Uneven widths were tried (74vw to 138vw) to stop the viewport
      edge reading as a frame; the cost was that the track almost never lined
      up, so every resting position showed two half-sections.
   2. THE TRAVEL IS REAL, EVEN THOUGH IT LANDS SQUARE. A gesture scrolls the
      track continuously and it decelerates - you watch the sections move past
      rather than cutting between them - and it finishes by settling onto a
      section. The settle uses the same easing as the gesture, so it reads as
      the movement completing, not as the page correcting you. What a deck
      does, and this does not, is teleport between fixed states with the travel
      removed.
   3. ONE CONTINUOUS GROUND. A single background across the whole track and a
      khipu cord running its entire length, knotting at each section. The cord
      is the thing that makes it one canvas instead of eight cards, and it is
      on the nose for a company named after knotted Andean record-keeping.
   4. CONTENT SITS AT DIFFERENT HEIGHTS. Top, middle, bottom, offset. A deck
      centres everything; a page does not.
   5. LAYERS MOVE AT DIFFERENT RATES, so the composition rearranges as you go
      rather than cutting between fixed states.
   ========================================================================= */
:root{
  /* --dim was #6D8294, which cleared 4.76:1 on the old flat background but
     only 4.29:1 once the ground became a gradient with lighter passages. It
     carries the legal line and the results caveat, so it has to clear on the
     LIGHTEST tone, not the average. */
  --bg:#0A1119; --ink:#F4EFE7; --muted:#93A7B4; --dim:#7A94A6;
  --line:#22323E; --copper:#E39767; --hot:#FF7A3D; --green:#4FBF95;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{background:var(--bg);color:var(--ink);
  font-family:'DM Sans',-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-family:'Manrope','DM Sans',sans-serif;line-height:.94;
  letter-spacing:-.045em;font-weight:800;text-transform:uppercase;}
em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;text-transform:none;
  letter-spacing:-.01em;font-weight:400;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px;}

/* The ground sits on the body so the scrolling track can stay transparent. */
body{background:
  radial-gradient(120% 90% at 20% 0%, #0E1A24 0%, transparent 60%),
  radial-gradient(120% 90% at 85% 100%, #101D28 0%, transparent 55%),
  #0A1119;}

/* ---- the track is one long canvas, not a stack of cards ---- */
.track{position:relative;z-index:1;display:flex;height:100vh;overflow-x:auto;overflow-y:hidden;
  /* CSS snapping and smooth scroll-behavior are both off on purpose. The settle
     is done in JS so it can be directional - a deliberate gesture advances
     rather than being pulled back to where it started - and CSS snap would
     fight that by re-pulling the position the moment the easing slows.
     scroll-behavior:smooth would animate every scrollLeft write, turning the JS
     easing into a rubber band and a drag into a lag. */
  cursor:grab;background:transparent;}
.track.dragging{cursor:grabbing;}
.track::-webkit-scrollbar{display:none;}
.track{scrollbar-width:none;}

/* The cord: one continuous line through the entire site, drifting slower than
   the content so the two never feel locked together.
   It lives in a FIXED layer, deliberately outside the scroll container. Inside
   it, the parallax transform extended the track's scrollable area, so the
   scrollWidth grew as you scrolled (12,028px to 12,894px) and the end of the
   site kept receding as you approached it. */
.cordwrap{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.cord{position:absolute;left:0;top:0;height:100%;will-change:transform;}

.panel{position:relative;z-index:1;height:100vh;
  padding:128px 5vw 104px;display:flex;flex-direction:column;flex:0 0 auto;}
/* Content sits at a different height in each section. A deck centres
   everything; this is what stops the eye settling into a rhythm. */
.panel.at-top{justify-content:flex-start;padding-top:158px;}
.panel.at-mid{justify-content:center;}
.panel.at-low{justify-content:flex-end;padding-bottom:150px;}

/* ---- reveal: content arrives as its section comes into view ---- */
[data-rv]{opacity:0;transform:translateY(20px);
  transition:opacity .66s cubic-bezier(.16,.8,.28,1),transform .66s cubic-bezier(.16,.8,.28,1);}
.live [data-rv]{opacity:1;transform:none;}
.live [data-rv]:nth-child(1){transition-delay:.02s;}
.live [data-rv]:nth-child(2){transition-delay:.08s;}
.live [data-rv]:nth-child(3){transition-delay:.14s;}
.live [data-rv]:nth-child(4){transition-delay:.20s;}
.live [data-rv]:nth-child(5){transition-delay:.26s;}
.live [data-rv]:nth-child(6){transition-delay:.32s;}

/* ---- fixed chrome ---- */
.hd{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:18px;
  padding:22px 5vw;mix-blend-mode:difference;}
.hd .bd{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;
  font-weight:800;letter-spacing:.16em;font-size:.86rem;}
.hd .bd img{width:24px;height:24px;border-radius:6px;}
.hd nav{margin-left:auto;display:flex;gap:19px;font-size:.75rem;letter-spacing:.15em;
  text-transform:uppercase;font-weight:700;}
.hd nav button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;opacity:.45;
  padding:2px 0;transition:opacity .2s;position:relative;}
.hd nav button:hover,.hd nav button[aria-current="true"]{opacity:1;}
.hd nav button[aria-current="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-5px;
  height:1.5px;background:currentColor;}

/* Wayfinding without deck furniture.
   A numbered corner ("05 / 08") and a row of segments along the bottom are
   exactly how a slide deck tells you where you are, so both are gone. What
   replaces them is a single unbroken hairline that fills as you move: the
   reading-progress convention from long-form web pages, which says "you are
   partway through a page" rather than "you are on slide five". The header nav
   keeps its underline, and that is the real wayfinding. */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;align-items:flex-end;justify-content:flex-end;padding:0 5vw 20px;
  pointer-events:none;}
.rail{position:fixed;left:0;right:0;bottom:0;height:2px;z-index:61;
  background:rgba(255,255,255,.07);}
/* Driven by transform, not width. The fill is updated on every animation frame
   now, and animating `width` relayouts the element each time, which is exactly
   the kind of per-frame layout work that shows up as stutter. scaleX is handled
   on the compositor. The old .18s transition is gone with it - with a value
   arriving every frame, a transition only adds lag. */
.rail i{display:block;height:100%;width:100%;background:var(--hot);
  transform:scaleX(0);transform-origin:0 50%;will-change:transform;}
.hint{flex:0 0 auto;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:9px;transition:opacity .5s;}
.hint.gone{opacity:0;}
.hint .ar{animation:nudge 1.7s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(7px);}}

/* ---- opening ---- */
.p-start{width:100vw;}
.p-start h1{font-size:min(8vw,10.6vh,8.4rem);}
.p-start h1 em{color:var(--copper);display:block;}
.lede{max-width:44ch;color:var(--muted);font-size:clamp(1rem,1.25vw,1.16rem);margin:22px 0 26px;}
/* The knot is an ATMOSPHERE layer, not a picture: full height, bleeding off the
   top and bottom, with the headline sitting on its dark left side. Two earlier
   passes both failed, in opposite directions.

   Pass 1 (original) put it in a 742x900 PORTRAIT box with object-fit:cover. The
   source is 1536x1024 - landscape, 3:2 - so cover threw away 45% of the image's
   width and you saw rope, never the knot. It was also anchored to the panel's
   right edge (right:-4vw on a 112vw panel), so the remainder ran past the first
   screen and came back sliced down the left of section two.

   Pass 2 fixed the cropping by shrinking it to its own aspect ratio, which is
   correct and looks like a stock photo dropped on the page. Wrong trade.

   What actually resolves it: the source is 3:2 and a screen is wider than 3:2,
   so an image scaled to FULL VIEWPORT HEIGHT is only 1.5x900 = 1350px wide -
   narrower than a 1440px screen. It can be full-bleed vertically, uncropped,
   and still fit inside the first screen horizontally. Nothing is cut, nothing
   crosses into section two, and it reads as ground rather than as a photo.

   min(150vh, 94vw) is the cap that keeps that true on a squarer monitor, where
   1.5x the height would be wider than the screen: there it sizes off width
   instead and simply bleeds less. */
.knot{position:absolute;right:15vw;left:auto;       /* 112vw panel - 15vw, so its
                                                       right edge lands at 97vw:
                                                       inside the first screen on
                                                       every viewport, which is
                                                       what stops the slicing */
  width:min(150vh,94vw);aspect-ratio:3/2;height:auto;
  top:50%;margin-top:calc(-1 * min(50vh,31.333vw));  /* half the computed height;
                                                        no transform, the
                                                        parallax owns that */
  /* At full size it is the brightest thing on the page, and the fixed chrome
     has to survive crossing it: the nav sits over the top-right rope and the
     ticker runs straight through the bottom ropes. Both were illegible at .92.
     Dropped to .72 and the vertical fades widened to 15%, which is deeper than
     the header (~60px) and than the ticker band (91px up from the bottom), so
     the image is already near-transparent everywhere the chrome lands. */
  opacity:.72;
  /* Horizontally: cleared entirely over the text column, then ramping to solid
     across the gap between the end of the headline and the knot itself, so the
     rope emerges from the dark rather than starting at an edge. */
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 38%,#000 60%,#000 90%,transparent 100%),
                     linear-gradient(180deg,transparent 0%,#000 15%,#000 85%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0%,transparent 38%,#000 60%,#000 90%,transparent 100%),
             linear-gradient(180deg,transparent 0%,#000 15%,#000 85%,transparent 100%);
  mask-composite:intersect;
  will-change:transform;z-index:0;}
.knot img{display:block;width:100%;height:100%;object-fit:cover;}

.p-start .inner{position:relative;z-index:2;max-width:52vw;}

.btn{display:inline-flex;align-items:center;gap:10px;background:var(--hot);color:#0A1119;
  font-weight:800;letter-spacing:.04em;padding:15px 26px;border-radius:2px;text-transform:uppercase;
  font-size:.82rem;border:0;cursor:pointer;font-family:inherit;
  transition:transform .16s,background .16s,box-shadow .16s;}
.btn:hover{background:var(--copper);transform:translate(-2px,-2px);box-shadow:5px 5px 0 rgba(227,151,103,.34);}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.line:hover{border-color:var(--hot);box-shadow:none;transform:none;background:transparent;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}

/* The ticker used to live inside the opening section at width:150%, so it ran
   out 806px into the SECOND section and stopped dead - a hard vertical edge
   with the text sliced mid-word, which is what made the page look unfinished.
   It is now a track-level band: one horizon line running the entire length of
   the site, the same move the cord makes, so it never terminates on screen.
   Its width is set in JS from track.scrollWidth (see fillTicker).
   It sits at bottom:44px, clear of the 104px floor the panels pad to, so it
   cannot collide with the lowest content in any section. */
.mq{position:absolute;left:0;bottom:44px;overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent);}
.mq div{display:inline-block;animation:slide 44s linear infinite;font-size:.75rem;
  letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:700;}
.mq b{color:var(--ink);}
@keyframes slide{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ---- shared type ---- */
.kick{font-size:.71rem;letter-spacing:.26em;text-transform:uppercase;color:var(--hot);
  font-weight:800;margin-bottom:20px;}
.say{font-size:min(5.2vw,8vh,4.3rem);max-width:15ch;}
.say em{color:var(--copper);}
.sub{color:var(--muted);max-width:56ch;font-size:1.01rem;margin-top:20px;}
.fine{color:var(--dim);font-size:.75rem;margin-top:20px;max-width:74ch;}


/* ---- one screen per section, exactly ----
   These ran from 74vw to 138vw so the viewport edge would stop reading as a
   frame. That is a real effect, but it has a cost that outweighs it here: with
   sections of uneven width the track almost never lines up with the screen, so
   at rest you are nearly always looking at the tail of one section and the head
   of the next. Every section is now exactly one screen, which is the only way
   a section can fill the screen on its own with nothing of its neighbours
   showing. */
.p-problem{width:100vw;}
.p-get{width:100vw;}
.p-process{width:100vw;}
.p-work{width:100vw;}
.p-fee{width:100vw;}
.p-questions{width:100vw;}
.p-operator{width:100vw;}

.cols{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:30px;}
.c3{grid-template-columns:repeat(3,minmax(0,1fr));}
/* Three across, two rows - not six across.
   The six-up row is why Deliverables and Work were 132vw and 138vw: six cards
   need that much width to stay readable, and the sections were sized to fit
   them. That is what produced a section you had to scroll twice to see, which
   is the thing being removed. At one screen wide, six columns would be 216px
   each - narrower than the "~$150K / yr" figure that has to sit in one - so the
   row wraps to two instead and the cards keep their proportions. */
.c6{grid-template-columns:repeat(3,minmax(0,1fr));}
.cols > div{background:#0B1520;padding:22px 20px;transition:background .2s;}
.cols > div:hover{background:#10202C;}
.cols b{display:block;font-family:'Manrope',sans-serif;font-size:min(2.9vw,4.2vh,2.5rem);
  letter-spacing:-.04em;color:var(--copper);line-height:1;}
.cols span.cap{display:block;margin-top:7px;font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:700;}
.cols p{color:var(--muted);font-size:.86rem;margin:7px 0 0;}
.cols h3{font-size:.95rem;text-transform:none;letter-spacing:-.01em;margin-bottom:5px;}

/* The problem list runs as a wide single row: a different shape again. */
.runlist{list-style:none;padding:0;margin:28px 0 0;display:flex;gap:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.runlist li{flex:1;padding:18px 20px 18px 0;border-right:1px solid var(--line);
  font-size:.96rem;display:flex;gap:12px;align-items:flex-start;}
.runlist li:last-child{border-right:0;}
.runlist i{font-style:normal;color:var(--hot);font-family:'Manrope',sans-serif;
  font-weight:800;font-size:.76rem;padding-left:20px;}

.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);max-width:720px;margin-top:30px;}
.tiers > div{background:#0B1520;padding:26px;}
.tiers .f{background:rgba(255,122,61,.1);}
.tiers .amt{font-family:'Manrope',sans-serif;font-size:2.8rem;letter-spacing:-.045em;}
.tiers .amt small{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.tiers .nm{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hot);font-weight:800;}
.tiers p{color:var(--muted);font-size:.89rem;margin:10px 0 18px;}

.qa{margin-top:22px;max-width:76ch;}
.qa details{border-top:1px solid var(--line);padding:12px 0;}
.qa details:last-of-type{border-bottom:1px solid var(--line);}
.qa summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:18px;
  font-weight:700;font-size:1rem;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary:after{content:"+";color:var(--hot);font-weight:800;}
.qa details[open] summary:after{content:"\2013";}
.qa p{color:var(--muted);margin:8px 0 0;font-size:.93rem;}

.face{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:end;}
.face img{width:200px;height:258px;object-fit:cover;object-position:center top;
  filter:grayscale(1) contrast(1.06);}

.swipe-note{display:none;color:var(--dim);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;margin-top:10px;}

/* ---- short viewports ----------------------------------------------------
   Now that every section has to fit one screen, height is as much of a
   constraint as width, and a 1366x768 laptop is the common case that fails.
   At 768 the standard frame leaves ~490px of room and Work's two rows of cards
   need ~590px. Because the low sections use justify-content:flex-end, that
   overflow goes UPWARDS - the "Selected work" kicker was printing on top of the
   KHIPUAI logo in the fixed header.

   So the frame tightens instead of the content colliding with the chrome. The
   bottom padding stays at 100px on purpose: the ticker band occupies 44px to
   91px up from the bottom, so anything less would push content into it. */
@media (min-width:901px) and (max-height:860px){
  .panel{padding:96px 5vw 100px;}
  .panel.at-top{padding-top:112px;}
  .panel.at-low{padding-bottom:100px;}
  .cols,.tiers,.runlist{margin-top:20px;}
  .cols > div{padding:15px 16px;}
  .tiers > div{padding:20px;}
  .sub,.fine{margin-top:13px;}
  .qa{margin-top:14px;}
  .lede{margin:16px 0 20px;}
  /* The founder portrait is the tallest fixed element on the page; at 258px it
     pushed the Founder section 11px into the ticker band. */
  .face img{width:168px;height:214px;}
}

/* A second, tighter tier. At 1280x720 the frame above still leaves only 524px
   and Work's two card rows need 554, so its kicker clipped under the header
   again. The card padding and the gaps give up the difference; the bottom stays
   at 100px for the ticker band, as above. */
@media (min-width:901px) and (max-height:740px){
  .panel{padding:76px 5vw 100px;}
  .panel.at-top{padding-top:88px;}
  .panel.at-low{padding-bottom:100px;}
  .cols,.tiers,.runlist{margin-top:16px;}
  .cols > div{padding:12px 14px;}
  .cols h3{margin-bottom:3px;}
  .cols p{font-size:.82rem;}
  .cols span.cap{margin-top:5px;}
  .face img{width:150px;height:192px;}
}

@media (max-width:900px){
  html,body{overflow:auto;height:auto;}
  .track{display:block;height:auto;overflow:visible;scroll-snap-type:none;cursor:auto;
    background:var(--bg);}
  .cord{display:none;}
  .panel,.p-start,.p-problem,.p-get,.p-process,.p-work,.p-fee,.p-questions,.p-operator{
    width:100%;height:auto;min-height:0;padding:88px 22px 38px;justify-content:flex-start;}
  .panel:last-child{padding-bottom:74px;}
  .p-start h1{font-size:clamp(2.3rem,10vw,3.4rem);}
  .p-start .inner{max-width:none;}
  .say{font-size:clamp(1.9rem,8vw,2.6rem);}
  /* The desktop rule now positions with left/top/aspect-ratio, so the stacked
     layout has to unset all three - left:50vw on a position:relative element
     would shove the image half a screen to the right. */
  .knot{position:relative;left:auto;right:auto;top:auto;margin-top:20px;
    width:100%;aspect-ratio:auto;height:180px;
    -webkit-mask-image:none;mask-image:none;}
  .mq,.hint,.rail{display:none;}
  .foot{position:static;padding:0;}
  .hd nav{display:none;}
  .runlist{flex-direction:column;}
  .runlist li{border-right:0;border-bottom:1px solid var(--line);padding:14px 0;}
  .runlist li:last-child{border-bottom:0;}
  .runlist i{padding-left:0;}
  /* Stacked, the six-up grids ran to 1,579px on their own. Swiping them keeps
     the concept's horizontal idea alive on a phone and roughly halves it. */
  .cols.c3,.cols.c6{display:flex;overflow-x:auto;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;}
  .cols.c3 > div,.cols.c6 > div{flex:0 0 76%;scroll-snap-align:start;}
  .cols.c3::-webkit-scrollbar,.cols.c6::-webkit-scrollbar{height:5px;}
  .cols.c3::-webkit-scrollbar-thumb,.cols.c6::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
  .swipe-note{display:block;}
  .tiers{grid-template-columns:minmax(0,1fr);}
  .face{grid-template-columns:1fr;gap:18px;align-items:start;}
  .face img{width:148px;height:178px;}
  [data-rv]{opacity:1;transform:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
  .track{scroll-behavior:auto;}
  [data-rv]{opacity:1;transform:none;}
}
</style>
</head>
<body>

<header class="hd">
  <div class="bd"><img src="../shared/assets/mark.svg" alt="">KHIPUAI</div>
  <nav id="nav" aria-label="Sections"></nav>
</header>

<div class="cordwrap"><svg class="cord" id="cord" aria-hidden="true" preserveAspectRatio="none"></svg></div>

<div class="track" id="track"></div>

<div class="rail"><i id="railfill"></i></div>

<div class="foot">
  <div class="hint" id="hint"><span>Scroll</span><span class="ar">&rarr;</span></div>
</div>

<script type="module">
import { C } from '../shared/content.js';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const mq = [...C.trust, ...C.stats].map(([a,b]) => `<b>${esc(a)}</b> ${esc(b)}`).join(' &nbsp;/&nbsp; ');

// `at` sets where the content sits vertically. Varying it is most of what
// stops a horizontal site reading as a deck.
const P = [
  { id:'start', n:'Overview', at:'at-mid', html:`
    <div class="knot" id="knot">
      <img src="../shared/assets/khipu-knot-v2.webp" alt="A sculptural copper knot, a contemporary reading of an Andean khipu">
    </div>
    <div class="inner">
      <div class="kick" data-rv>${esc(C.hero.eyebrow)}</div>
      <h1 data-rv>${esc(C.hero.headline)}<em>${esc(C.hero.headlineEm)}</em></h1>
      <p class="lede" data-rv>${esc(C.hero.sub)}</p>
      <div class="row" data-rv>
        <a class="btn" href="${C.booking}">${esc(C.hero.cta)}</a>

const track = document.getElementById('track');
const cord = document.getElementById('cord');
track.innerHTML = ( P.map((p,i) =>
  `<section class="panel p-${p.id} ${p.at}" id="p-${p.id}" data-i="${i}" aria-label="${esc(p.n)}">
     ${p.html}</section>`).join(''));

const panels = [...track.querySelectorAll('.panel')];

/* The ticker is appended to the track rather than written into the opening
   section, so it can run the full length of the site. It is absolutely
   positioned, so it takes no part in the flex flow and does not widen it. */
const mqEl = document.createElement('div');
mqEl.className = 'mq';
mqEl.setAttribute('aria-hidden', 'true');
mqEl.innerHTML = '<div></div>';
track.appendChild(mqEl);

/* The strip animates to translateX(-50%), which is only seamless when it is
   exactly two identical halves. The old markup used THREE copies against that
   -50%, so the loop jumped a half-copy every pass. Copies are now computed
   from the real track width, always even, and only rebuilt when the count
   actually changes - rebuilding restarts the animation. */
const mqUnit = mq + ' &nbsp;/&nbsp; ';
const MQ_SPEED = 42;          // px per second - slow enough to actually read
let mqCopies = 0;
function fillTicker(){
  const W = track.scrollWidth;
  if (!W) return;
  mqEl.style.width = W + 'px';
  const inner = mqEl.firstElementChild;
  if (!mqCopies) { inner.innerHTML = mqUnit; mqCopies = 1; }
  // Measured live rather than cached: one copy's width moves when the webfonts
  // swap in, and a stale figure leaves a gap at the end of the band.
  const unitW = inner.getBoundingClientRect().width / mqCopies;
  if (!unitW) return;                       // display:none on the phone layout
  const want = Math.max(1, Math.ceil(W / unitW)) * 2;
  if (want !== mqCopies) {
    mqCopies = want;
    inner.innerHTML = mqUnit.repeat(want);
  }
  /* Speed is set here, not in the CSS, because the duration was fixed at 44s
     while the distance travelled is half the strip - which grows with the
     track. That made the band run at 262px/s on a 1440px screen, far too fast
     to read, and a different speed on every other screen size. Pinning px/sec
     instead makes it readable and consistent everywhere. */
  const half = (unitW * mqCopies) / 2;
  inner.style.animationDuration = (half / MQ_SPEED).toFixed(1) + 's';
}

const nav = document.getElementById('nav');
nav.innerHTML = P.map(p => `<button data-to="${p.id}">${esc(p.n)}</button>`).join('');
const railfill = document.getElementById('railfill');
const hint = document.getElementById('hint');

/* ---- the cord -----------------------------------------------------------
   One line across the whole site, knotting at each section. Drawn after
   layout because it has to know the real, uneven total width. */
function drawCord(){
  if (!panels.length || track.scrollWidth <= track.clientWidth) return;
  const W = track.scrollWidth, H = track.clientHeight;
  cord.setAttribute('width', W);
  cord.setAttribute('height', H);
  cord.setAttribute('viewBox', `0 0 ${W} ${H}`);
  cord.style.width = W + 'px';
  // A slow wave that dips and rises across the whole length.
  let d = `M 0 ${H * 0.62}`;
  panels.forEach((p, i) => {
    const x = p.offsetLeft + p.offsetWidth / 2;
    const y = H * (i % 2 ? 0.40 : 0.68);
    d += ` S ${x - p.offsetWidth * 0.3} ${y} ${x} ${y}`;
  });
  d += ` S ${W - 200} ${H * 0.5} ${W} ${H * 0.55}`;
  const knots = panels.map((p, i) => {
    const x = p.offsetLeft + p.offsetWidth / 2;
    const y = H * (i % 2 ? 0.40 : 0.68);
    return `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#E39767" stroke-opacity=".30" stroke-width="2"/>
            <circle cx="${x}" cy="${y}" r="2.5" fill="#E39767" fill-opacity=".45"/>`;
  }).join('');
  /* The travelling light is drawn as its own short polyline rather than as a
     dash on the full path. A stroke-dasharray animation would have to repaint
     an 11,520px-wide path every frame; sampling ~16 points around the light's
     position and stroking just those costs the same whatever the site's length.
     The gradient gives it soft ends, and it is in userSpaceOnUse so its x1/x2
     can be moved to wherever the light currently is. */
  cord.innerHTML =
    `<defs>
       <linearGradient id="cordglow" gradientUnits="userSpaceOnUse">
         <stop offset="0"   stop-color="#FF7A3D" stop-opacity="0"/>
         <stop offset=".45" stop-color="#FFD2AC" stop-opacity=".95"/>
         <stop offset=".55" stop-color="#FFD2AC" stop-opacity=".95"/>
         <stop offset="1"   stop-color="#FF7A3D" stop-opacity="0"/>
       </linearGradient>
     </defs>
     <path id="cordbase" d="${d}" fill="none" stroke="#E39767" stroke-opacity=".17" stroke-width="2"/>
     <path d="${d}" fill="none" stroke="#E39767" stroke-opacity=".08" stroke-width="7"/>${knots}
     <polyline id="cordhalo"  fill="none" stroke="url(#cordglow)" stroke-opacity=".16"
               stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
     <polyline id="cordbloom" fill="none" stroke="url(#cordglow)" stroke-opacity=".42"
               stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
     <polyline id="cordlight" fill="none" stroke="url(#cordglow)"
               stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  basePath = cord.querySelector('#cordbase');
  glowGrad = cord.querySelector('#cordglow');
  // Three stacked strokes: a wide faint halo, a mid bloom, and the hot core.
  // One stroke reads as a coloured dash; the stack reads as something glowing.
  lightEls = [cord.querySelector('#cordhalo'), cord.querySelector('#cordbloom'),
              cord.querySelector('#cordlight')];
  pathLen  = basePath.getTotalLength();
}

/* ---- the light in the cord ----------------------------------------------
   A charge that runs along the khipu cord for the whole length of the site.
   It follows the pointer: the cord is the one element that is continuous from
   the first section to the last, so giving it something that reacts turns it
   from a drawn decoration into the thing the page is strung on.

   The pointer sets a TARGET position and the light eases toward it, so it
   trails the cursor and overshoots slightly rather than being welded to it.
   When the pointer has been still for a while it goes back to drifting along
   on its own, so the cord is never dead on an untouched screen. */
let basePath = null, glowGrad = null, lightEls = [], pathLen = 0;
let lightAt = 0, lightTo = 0, lastPoint = 0, lightRaf = 0;
const LIGHT_SPAN = 300;       // how long the glowing stretch is, in path units
const LIGHT_EASE = 0.055;     // how lazily it follows
const IDLE_AFTER = 2200;      // ms of stillness before it drifts by itself
const DRIFT = 0.00022;        // fraction of the path per frame when drifting

function drawLight(){
  if (!basePath || !pathLen) return;
  const centre = lightAt * pathLen;
  const pts = [];
  for (let i = 0; i <= 16; i++) {
    const at = centre - LIGHT_SPAN / 2 + (LIGHT_SPAN * i) / 16;
    if (at < 0 || at > pathLen) continue;
    const p = basePath.getPointAtLength(at);
    pts.push(`${p.x.toFixed(1)},${p.y.toFixed(1)}`);
  }
  if (pts.length < 2) { lightEls.forEach(el => el && el.setAttribute('points', '')); return; }
  const a = basePath.getPointAtLength(Math.max(0, centre - LIGHT_SPAN / 2));
  const b = basePath.getPointAtLength(Math.min(pathLen, centre + LIGHT_SPAN / 2));
  glowGrad.setAttribute('x1', a.x); glowGrad.setAttribute('y1', a.y);
  glowGrad.setAttribute('x2', b.x); glowGrad.setAttribute('y2', b.y);
  const s = pts.join(' ');
  lightEls.forEach(el => el && el.setAttribute('points', s));
}

function lightTick(){
  lightRaf = 0;
  if (!pathLen) return;              // no cord on the stacked phone layout
  const now = performance.now();
  if (now - lastPoint > IDLE_AFTER) {
    lightTo += DRIFT;
    if (lightTo > 1.08) { lightTo = -0.08; lightAt = -0.08; }   // loop round
  }
  lightAt += (lightTo - lightAt) * LIGHT_EASE;
  drawLight();
  lightRaf = requestAnimationFrame(lightTick);
}

addEventListener('pointermove', e => {
  if (!pathLen || !horizontal()) return;
  /* Screen x to a position along the cord. The cord lives in a fixed layer that
     is translated by -scrollLeft * 0.58, so the pointer's x has to be put back
     into cord space before it means anything. */
  const cordX = e.clientX + track.scrollLeft * 0.58;
  lightTo = Math.max(0, Math.min(1, cordX / Math.max(1, track.scrollWidth)));
  lastPoint = performance.now();
}, { passive: true });

// Checked directly rather than via REDUCED: that const is declared further down
// the file, and reading it here would be a temporal-dead-zone error at load.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  lightRaf = requestAnimationFrame(lightTick);
}

/* ---- navigation ---------------------------------------------------------
   Sections are different widths now, so positions come from offsetLeft
   rather than index * innerWidth. The index stays explicit state: reading
   scroll position mid-animation returns a half-finished number. */
let current = 0;
const clamp = i => Math.max(0, Math.min(P.length - 1, i));
const indexOf = id => Math.max(0, P.findIndex(p => p.id === id));
const horizontal = () => track.scrollWidth > track.clientWidth + 1;
// Align each section to its LEFT edge, clamped to the track.
//
// Centring was wrong twice over. Sections are often WIDER than the viewport,
// and centring one of those scrolls right and crops both edges: the opening
// headline was sitting 87px off the left of the screen. And for the narrower
// sections, aligning left is the better behaviour anyway, because it lets the
// edge of the next section show at the right, which is exactly the continuity
// a deck never has.
const leftFor = i => {
  const max = Math.max(0, track.scrollWidth - track.clientWidth);
  return Math.max(0, Math.min(max, panels[i].offsetLeft));
};
const nearest = () => {
  const x = track.scrollLeft;
  let best = 0, bd = Infinity;
  panels.forEach((p, i) => { const d = Math.abs(leftFor(i) - x); if (d < bd) { bd = d; best = i; } });
  return best;
};

/* ---- motion: one loop chasing one target --------------------------------
   The previous version had two separate motions - a friction glide for the
   gesture and a timed eased animation for the settle - and handing over between
   them is a large part of what felt choppy: the glide decelerated to a stop,
   then a second animation started from scratch and moved it again.

   There is now ONE model. `target` is where the track wants to be; `pos` eases
   towards it every frame. A gesture pushes the target ahead, the snap sets the
   target to a stop, and in both cases the same easing carries it, so a flick
   that ends in a snap is a single continuous movement.

   Two details that matter more than the easing curve itself:

   - `pos` is kept as a float and ASSIGNED to scrollLeft, never accumulated
     into it. `scrollLeft += v` reads back a value the browser has already
     rounded, so the error compounds every frame and the motion grinds at low
     speed. That was the actual source of the stepping.
   - the approach rate is scaled by real frame time, so the feel is identical
     on a 60Hz and a 144Hz screen instead of being ~2.4x faster on the latter. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LERP = 0.095;          // fraction of the remaining distance per 60Hz frame
let target = 0, pos = 0, raf = 0, lastFrame = 0;

const maxScroll = () => Math.max(0, track.scrollWidth - track.clientWidth);
const clampX = v => Math.max(0, Math.min(maxScroll(), v));

function frame(now){
  const dt = lastFrame ? Math.min(64, now - lastFrame) : 16.67;
  lastFrame = now;
  const d = target - pos;
  if (Math.abs(d) < 0.35) {
    pos = target; track.scrollLeft = pos; raf = 0; lastFrame = 0;
    return;
  }
  // Frame-rate independent exponential approach.
  pos += d * (1 - Math.pow(1 - LERP, dt / 16.67));
  track.scrollLeft = pos;
  raf = requestAnimationFrame(frame);
}
function run(){ if (!raf) { lastFrame = 0; raf = requestAnimationFrame(frame); } }
function jumpTo(x){
  cancelAnimationFrame(raf); raf = 0; lastFrame = 0;
  pos = target = clampX(x);
  track.scrollLeft = pos;
}
function setTarget(x){
  target = clampX(x);
  if (REDUCED) return jumpTo(target);
  run();
}
function stopMotion(){ jumpTo(track.scrollLeft); }

function goTo(i, push = true){
  const from = current;
  current = clamp(i);
  clearTimeout(snapT);
  if (horizontal()) {
    // A jump across the whole site was about 1.5s of watching sections fly
    // past. Neighbours keep the travel, which is the charm; longer jumps land
    // immediately.
    if (Math.abs(current - from) > 2) jumpTo(leftFor(current));
    else setTarget(leftFor(current));
    gestureFrom = leftFor(current);
  } else panels[current].scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (push && location.hash.slice(1) !== P[current].id) {
    history.pushState({ i: current }, '', '#' + P[current].id);
  }
  paint();
}

function paint(){
  // The header nav is now the only place that says where you are. No counter,
  // no segments: those read as slide numbers however they are styled.
  nav.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.to === P[current].id ? 'true' : 'false'));
}

/* Reveal once, then stay revealed.
   This used to live in paint(): whichever section was "current" got .live and
   every other section lost it, so content animated in on arrival and blanked
   out again behind you. That is a slide build - it is the behaviour that made
   the page feel like a deck even more than the snapping did, because it meant
   only one section was ever really present. Sections now reveal as they come
   into view and simply stay there, which is what a page does. */
if (window.IntersectionObserver) {
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    en.target.classList.add('live');
    io.unobserve(en.target);
  }), { root: track, rootMargin: '0px 12% 0px 12%', threshold: 0.01 });
  panels.forEach(p => io.observe(p));
} else panels.forEach(p => p.classList.add('live'));

// Continuous reading progress, driven by actual scroll position rather than by
// section index, so it moves smoothly as you drift instead of ticking over.
function progress(){
  const max = maxScroll();
  railfill.style.transform = `scaleX(${max > 0 ? Math.min(1, track.scrollLeft / max) : 0})`;
}

function layout(){
  drawCord();
  fillTicker();
  progress();
  paint();
  // The light loop stops itself when there is no cord to light, which is the
  // case on the stacked phone layout. Restart it here so that widening the
  // window back past 900px brings the cord to life again.
  if (pathLen && !lightRaf && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    lightRaf = requestAnimationFrame(lightTick);
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-to]');
  if (!b) return;
  e.preventDefault();
  goTo(indexOf(b.dataset.to));
});

/* ---- momentum: free travel, then a magnetic settle ----------------------
   The old wheel handler jumped a whole section per gesture and locked input
   for 640ms afterwards. However the sections were styled, that is a slide
   remote: you could not move a little, could not see two sections at once,
   and could never reach the right-hand side of a section wider than the
   screen - the sixth Work column was literally unreachable.

   Wheel and drag now add VELOCITY, and a rAF loop spends it against friction,
   so the track keeps travelling after the gesture and decelerates. When it has
   nearly stopped, the settle pulls it onto the nearest section start - but
   only from within 40% of a screen. Beyond that it leaves you where you are,
   which is what makes a wide section readable and is the whole difference
   between a magnetic page and a carousel. */
const WHEEL_GAIN = 3.4;       // one 100px mouse notch pushes the target ~340px
const MAX_LEAD = 1.15;        // the target may never run more than this many
                              // screens ahead of where the track actually is,
                              // or a trackpad's stream of small deltas piles up
                              // into a target three sections away
const SNAP_DELAY = 110;       // quiet time before it commits
const GESTURE_GAP = 220;      // wheel events closer together than this are one gesture
let drag = null, curT = 0, snapT = 0, gestureFrom = 0, lastInput = 0;

/* The track comes to rest on a section, every time.
   "Stops wherever you stop" and "never show two sections at once" cannot both
   be true, and one section per screen is the requirement, so the settle is back.
   Two things make it different from the version that felt like a carousel:
   every section is now exactly one screen, so there is one obvious place to land
   and the correction is never more than half a screen; and the travel getting
   there is the same eased motion as the gesture itself, so it reads as the
   movement finishing rather than as the page yanking. */
function markCurrent(){
  const i = nearest();
  if (i !== current) { current = i; paint(); }
}

/* Consecutive wheel events are one gesture until there is a real pause, so
   spinning the wheel four times is a single movement, not four. */
function markGesture(){
  const now = performance.now();
  if (now - lastInput > GESTURE_GAP) gestureFrom = pos;
  lastInput = now;
}

function snapNow(){
  if (drag) { clearTimeout(snapT); snapT = setTimeout(snapNow, 90); return; }
  const pts = panels.map((p, i) => leftFor(i));
  const moved = target - gestureFrom;
  let pool = pts;
  /* A deliberate gesture always advances. Landing on the plain nearest section
     meant a short scroll rubber-banded back to where it started, which reads as
     the page refusing you - so once a gesture has covered more than a tenth of a
     screen, only sections PAST where it began are eligible, in the direction it
     was going. Anything smaller is a nudge and does return. */
  if (Math.abs(moved) > track.clientWidth * 0.1) {
    const fwd = moved > 0;
    const ahead = pts.filter(p => fwd ? p > gestureFrom + 1 : p < gestureFrom - 1);
    if (ahead.length) pool = ahead;
  }
  let best = pool[0], bd = Infinity;
  pool.forEach(pt => { const d = Math.abs(pt - target); if (d < bd) { bd = d; best = pt; } });
  setTarget(best);
  gestureFrom = best;
  markCurrent();
}
function scheduleSnap(){ clearTimeout(snapT); snapT = setTimeout(snapNow, SNAP_DELAY); }

track.addEventListener('wheel', e => {
  if (!horizontal()) return;            // the stacked phone layout scrolls normally
  // Both axes handled here: passing one through to the browser gave a trackpad
  // and a mouse different behaviours. deltaMode is normalised because a mouse
  // can report lines or pages rather than pixels.
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? track.clientWidth : 1;
  const delta = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
  if (!delta) return;
  e.preventDefault();
  markGesture();
  const lead = track.clientWidth * MAX_LEAD;
  setTarget(Math.max(pos - lead, Math.min(pos + lead, target + delta * WHEEL_GAIN)));
  scheduleSnap();
}, { passive: false });

/* ---- drag ---- */
track.addEventListener('pointerdown', e => {
  if (!horizontal() || e.pointerType === 'touch') return;   // touch scrolls natively
  if (e.target.closest('a,button,summary,input')) return;
  clearTimeout(snapT);
  stopMotion();
  lastInput = 0; markGesture();          // a press always begins a fresh gesture
  drag = { x: e.clientX, left: track.scrollLeft, lastX: e.clientX, lastT: performance.now(), v: 0 };
  track.classList.add('dragging');
  track.setPointerCapture(e.pointerId);
});
track.addEventListener('pointermove', e => {
  if (!drag) return;
  // A drag tracks the cursor exactly - no easing, or the content lags the hand.
  jumpTo(drag.left - (e.clientX - drag.x));
  // Release velocity is measured from the last few milliseconds of the drag,
  // so letting go mid-flick carries on rather than stopping dead.
  const now = performance.now(), dt = now - drag.lastT;
  if (dt > 0) drag.v = ((drag.lastX - e.clientX) / dt) * 16;   // px per frame
  drag.lastX = e.clientX; drag.lastT = now;
});
function endDrag(e){
  if (!drag) return;
  const v = performance.now() - drag.lastT < 90 ? drag.v : 0;  // a pause means stop
  track.classList.remove('dragging');
  try { track.releasePointerCapture(e.pointerId); } catch {}
  drag = null;
  // Throw the target ahead by roughly the distance the flick would have
  // carried, and let friction do the rest.
  if (v) setTarget(target + v * 12);
  lastInput = performance.now();
  scheduleSnap();
}
track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);

addEventListener('keydown', e => {
  if (!horizontal() || e.target.closest('input,textarea')) return;
  if (e.key === 'Home') { e.preventDefault(); return goTo(0); }
  if (e.key === 'End')  { e.preventDefault(); return goTo(P.length - 1); }
  const d = { ArrowRight:1, ArrowLeft:-1, PageDown:1, PageUp:-1 }[e.key];
  if (!d) return;
  e.preventDefault();
  goTo(current + d);
});

/* ---- parallax: layers travel at their own rates ---- */
const knotEl = document.getElementById('knot');
track.addEventListener('scroll', () => {
  if (!horizontal()) return;
  const x = track.scrollLeft;
  progress();
  cord.style.transform = `translateX(${-x * 0.58}px)`;  // fixed layer: drifts at 0.58x
  if (knotEl) knotEl.style.transform = `translateX(${x * 0.1}px)`;
  // Scrolling this loop did not cause - a touch swipe, the scrollbar, a
  // find-in-page jump - has to be adopted, or the next gesture would spring
  // back to a stale target.
  if (!raf && !drag) {
    pos = target = x;
    if (performance.now() - lastInput > GESTURE_GAP) gestureFrom = x;
    scheduleSnap();
  }
  clearTimeout(curT);
  curT = setTimeout(markCurrent, 120);
}, { passive: true });

addEventListener('popstate', () => goTo(indexOf(location.hash.slice(1)), false));
addEventListener('resize', () => { layout(); if (horizontal()) jumpTo(leftFor(current)); });

let hinted = false;
const dropHint = () => { if (!hinted) { hinted = true; hint.classList.add('gone'); } };
['wheel','pointerdown','keydown'].forEach(t => addEventListener(t, dropHint, { once:true, passive:true }));

layout();
goTo(location.hash ? indexOf(location.hash.slice(1)) : 0, false);

// Section widths are content-driven, so they move as webfonts swap in and as
// images decode. Redrawing only on fonts.ready left the cord measurably short
// of the track, so watch the sections themselves and redraw when any of them
// actually changes size.
const relayout = () => { layout(); if (horizontal()) jumpTo(leftFor(current)); };
if (window.ResizeObserver) {
  let pending;
  const ro = new ResizeObserver(() => { clearTimeout(pending); pending = setTimeout(relayout, 60); });
  panels.forEach(p => ro.observe(p));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
</script>
</body>
