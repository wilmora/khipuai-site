name: Deploy public site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage public files only (strip internal docs, scripts, and tests)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git*' \
            --exclude='_site' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='demos/README.md' \
            --exclude='logos/SOURCES.md' \
            --exclude='docs/' \
            --exclude='edge/' \
            --exclude='tools/' \
            --exclude='tests/' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
